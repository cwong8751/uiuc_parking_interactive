<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UIUC Motorcycle Parking Finder</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
  <header>
    <nav class="blue-grey darken-4">
      <div class="nav-wrapper container">
        <span class="left white-text flow-text">uiuc motorcycle parking finder</span>
      </div>
    </nav>
  </header>

  <main>
    <div class="container">
      <div class="card-panel">
        <div class="input-field">
          <i class="material-icons prefix">search</i>
          <input id="search" type="text" autocomplete="off" placeholder="search">
        </div>
        <span>parking type:</span>
        <label><input type="checkbox" class="filled-in" id="filter-permit" checked><span>permit</span></label>
        <label><input type="checkbox" class="filled-in" id="filter-meter" checked><span>meter</span></label>
      </div>
    </div>

    <!-- Leaflet requires the map element to have an explicit height -->
    <div id="map" style="height: 60vh;"></div>

    <div class="container">
      <h5>All parking spaces <span id="count" class="grey-text"></span></h5>
      <div id="list" class="row"></div>
      <p id="empty" class="center-align grey-text hide">No parking spaces match your search.</p>
    </div>
  </main>

  <div id="space-modal" class="modal">
    <div class="modal-content">
      <img id="modal-image" class="responsive-img" alt="">
      <h5 id="modal-location"></h5>
      <span id="modal-type" class="new badge" data-badge-caption=""></span>
      <p id="modal-capacity"></p>
      <p id="modal-description"></p>
    </div>
    <div class="modal-footer">
      <a href="#!" class="modal-close waves-effect btn-flat">Close</a>
    </div>
  </div>

  <footer class="page-footer blue-grey darken-4" style="position: sticky; bottom: 0; z-index: 1000;">
    <div class="footer-copyright">
      <div class="container">
        Made by Carl. This website is not affiliated with the University of Illinois Urbana-Champaign or the University of Illinois Parking Department.
      </div>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
